name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check js/data.js
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop + phone)
        run: npm test
